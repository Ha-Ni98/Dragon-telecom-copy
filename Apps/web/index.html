<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dragon Telecom</title>
    <!-- S38 — static FRENCH fallbacks. This is a client-rendered SPA: link-preview scrapers
         (WhatsApp, Facebook) never run JS, so these are what a shared link shows. The running app
         overrides them from Settings → Storefront (hooks/use-document-meta.ts) — browsers and
         Google see that; share previews follow it only once the head is injected server-side. -->
    <meta name="description" content="Pièces détachées et accessoires pour smartphones — écrans, batteries, connecteurs de charge. Livraison en Algérie et service de réparation." />
    <meta property="og:title" content="Dragon Telecom" />
    <meta property="og:description" content="Pièces détachées et accessoires pour smartphones — écrans, batteries, connecteurs de charge. Livraison en Algérie et service de réparation." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <!-- Scrapers need an ABSOLUTE url; VITE_SITE_URL is the web app's public origin (see
         .env.example). The file is public/og-default.jpg. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme class before React mounts — this is a pure client SPA with no
      // server render, so next-themes alone can't prevent a flash of the wrong theme.
      // No system-preference fallback: defaultTheme is "light".
      (function () {
        if (localStorage.getItem("app_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
